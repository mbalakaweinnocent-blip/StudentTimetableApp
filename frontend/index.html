<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Timetable & Goals</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Timetable & Goals</h1>
        <p>Manage your university timetable and study goals in one place.</p>
    </header>

    <main>
        <section>
            <h2>Add or Edit Timetable Record</h2>

            <form id="timetableForm">
                <input type="hidden" id="recordId">

                <label for="course_code">Course Code:</label>
                <input type="text" id="course_code" placeholder="e.g. ICT251" required>
                <br><br>

                <label for="course_name">Course Name:</label>
                <input type="text" id="course_name" placeholder="Enter course name" required>
                <br><br>

                <label for="day_of_week">Day:</label>
                <select id="day_of_week" required>
                    <option value="">Choose a day</option>
                    <option>Monday</option>
                    <option>Tuesday</option>
                    <option>Wednesday</option>
                    <option>Thursday</option>
                    <option>Friday</option>
                    <option>Saturday</option>
                    <option>Sunday</option>
                </select>
                <br><br>

                <label for="start_time">Start Time:</label>
                <input type="time" id="start_time" required>
                <br><br>

                <label for="end_time">End Time:</label>
                <input type="time" id="end_time" required>
                <br><br>

                <label for="venue">Venue:</label>
                <input type="text" id="venue" placeholder="Enter venue">
                <br><br>

                <label for="study_goal">Study Goal:</label>
                <input type="text" id="study_goal" placeholder="Enter your study goal">
                <br><br>

                <button type="submit">Save Record</button>
                <button type="button" id="cancelEdit">Cancel Edit</button>
            </form>

            <p id="message" role="status"></p>
        </section>

        <section>
            <h2>My Timetable</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Course Code</th>
                            <th>Course Name</th>
                            <th>Day</th>
                            <th>Start</th>
                            <th>End</th>
                            <th>Venue</th>
                            <th>Study Goal</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="timetableBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Student Timetable & Goals System | Mulungushi University</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
